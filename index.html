<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>🔀</title>
        <link href="style.css?v=0.1" rel="stylesheet">
    </head>
    <body>
        <video autoplay loop muted>
            <source src="video/web_background_shuffle_shuffle_dot_to.mp4">
        </video>

        <div id="container">
            <div id="content">
            </div>
        </div>


        <script>
            let workTemplate = '<h1></h1><div class="work_video"><iframe frameborder="0" scrolling="no" marginheight="0" marginwidth="0"width="788.54" height="443" type="text/html" src=""></iframe></div><div class="info"><p class="fecha"></p><p class="formato"></p><p class="descripcion"></p></div>';

            async function cargarDatosJSON() {
                try {
                    // 1. Hace la petición al archivo en el mismo servidor
                    const respuesta = await fetch('worksDB.json');
                    
                    // 2. Verifica si el archivo existe y se pudo leer
                    if (!respuesta.ok) {
                    throw new Error(`Error al leer el archivo: ${respuesta.status}`);
                    }
                    
                    // 3. Convierte el JSON directamente a una variable de JS
                    const datos = await respuesta.json();
                    
                    // 4. Usa los datos en tu lógica
                    CreaWorks(datos);

                } catch (error) {
                    console.error('Hubo un problema con la carga:', error);
                }
            }

            window.onload = function(){
                cargarDatosJSON();
            }

            const youtubeEmbedCodeS = "https://www.youtube.com/embed/"
            const youtubeEmbedCodeF = "?autoplay=0&fs=1&iv_load_policy=3&showinfo=0&rel=0&cc_load_policy=0&start=0&end=0&vq=hd1080&origin=http://youtubeembedcode.com"

            function CreaWorks(data)
            {
                const parent = document.getElementById("content")
                parent.style.width = (1485 * data.works.length) + "px";

                for(let i = 0 ; i < data.works.length; i++)
                {
                    const work = data.works[i];
                    
                    const container = document.createElement("div");
                    container.setAttribute("class", "work")
                    parent.appendChild(container);
                    container.innerHTML = workTemplate;
                    
                    const titulo = container.getElementsByTagName("h1")[0];
                    titulo.innerHTML = work.titulo;


                    console.log(titulo);
                    const video = container.getElementsByTagName("iframe")[0];
                    video.setAttribute("src" ,youtubeEmbedCodeS + work.hVideo + youtubeEmbedCodeF);
                    
                    const fecha = container.getElementsByClassName("fecha")[0];
                    fecha.innerHTML = work.info.fecha;

                    const formato = container.getElementsByClassName("formato")[0];
                    formato.innerHTML = work.info.formato;

                    const descripcion = container.getElementsByClassName("descripcion")[0];
                    for(let i = 0; i < work.info.descripcion.length; i++)
                    {
                        const p = document.createElement("p");
                        p.innerHTML = work.info.descripcion[i];
                        descripcion.appendChild(p);
                    }
                    
                    const info = container.getElementsByClassName("info")[0];
                    if(work.info.otraV.length > 0)
                    {
                        const p = document.createElement("p");
                        p.innerHTML = "otras versiones";
                        const ul = document.createElement("ul");
                        p.appendChild(ul);
                        
                        for(let i = 0; i < work.info.otraV.length; i++)
                        {
                            ul.innerHTML = "<li><a></a></li>";
                            const a = ul.getElementsByTagName("a")[0];
                            a.setAttribute("href", work.info.otraV[i].video);
                            a.innerHTML = work.info.otraV[i].titulo;
                        }
                        info.appendChild(p);
                    }
                }
                
                // bio
                const container = document.createElement("div");
                container.setAttribute("class", "work")
                parent.appendChild(container);

                const shuffle = document.createElement("h1");
                shuffle.innerHTML = "🔀🔀:"
                container.appendChild(shuffle);
                container.appendChild(document.createElement("br"));
                
                const pSean = document.createElement("p");
                pSean.innerHTML = data.bios.sean.bio;
                pSean.appendChild(document.createElement("br"));
                const aSean = document.createElement("a");
                aSean.innerHTML = "Sitio Web";
                aSean.setAttribute("src", data.bios.sean.sitio);
                pSean.appendChild(aSean);
                container.appendChild(pSean);

                const pFelipe = document.createElement("p");
                pFelipe.innerHTML = data.bios.felipe.bio;
                pFelipe.appendChild(document.createElement("br"));
                const aFelipe = document.createElement("a");
                aFelipe.innerHTML = "Sitio Web";
                aFelipe.setAttribute("src", data.bios.felipe.sitio);
                pFelipe.appendChild(aFelipe);
                container.appendChild(pFelipe);
            }

        </script>
        <script>
            function transformScroll(event) 
            {
                if (!event.deltaY)
                    return;
                event.currentTarget.scrollLeft += event.deltaY + event.deltaX;
                event.preventDefault();
            }

            var element = document.scrollingElement || document.documentElement;
            element.addEventListener('wheel', transformScroll);

        </script>

    </body>
</html>
